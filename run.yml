name: yt-auto
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
          pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private
          MANIM_QUALITY: l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-output
          path: |
            work/final.mp4
            work/thumb.png
            work/script.json
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add used.txt
          git commit -m "used topic" || true
          git push || true
